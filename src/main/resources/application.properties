spring.application.name=AlmacenFarmaceutico
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/almacen_farmacia_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Clave Base64 de al menos 32 bytes; vacía genera una clave nueva en cada arranque.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:30m}


app.cors.origins=${CORS_ORIGINS:http://localhost:4200}
app.admin.usuario=${ADMIN_USUARIO:admin}
app.admin.contrasena=${ADMIN_PASSWORD:admin}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}
